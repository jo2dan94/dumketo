name: Build and verify port

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patches/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "BUILD-MULTIAPP-PORTED.ps1"
      - "BUILD-REMOTE-MPP.ps1"
      - "VERIFY-MULTIAPP-PORT.ps1"
      - "VERIFY-REMOTE-RELEASE.ps1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\BUILD-REMOTE-MPP.ps1

      - name: Verify
        shell: pwsh
        run: |
          .\VERIFY-REMOTE-RELEASE.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-app-patches-mpp
          path: |
            dist/*.mpp
            dist/BUILD-VALIDATION.txt
